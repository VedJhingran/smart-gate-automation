<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>
text{font-family:Arial,sans-serif;font-size:20px;fill:#fff}
.small{font-size:16px}
.box{fill:#1f2937;stroke:#60a5fa;stroke-width:2;rx:12}
.line{stroke:#94a3b8;stroke-width:3;marker-end:url(#a)}
.title{font-size:34px;font-weight:bold}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<rect width="100%" height="100%" fill="#0f172a"/>

<text x="410" y="50" class="title">Hardware Wiring</text>
<rect class="box" x="80" y="280" width="220" height="80"/><text x="125" y="325">Doorbell</text>
<rect class="box" x="420" y="250" width="260" height="140"/><text x="515" y="300">ESP32</text><text class="small" x="465" y="330">GPIO27 Doorbell In</text><text class="small" x="465" y="355">GPIO23 Relay Out</text>
<rect class="box" x="820" y="280" width="260" height="80"/><text x="855" y="325">Isolated Relay</text>
<rect class="box" x="820" y="500" width="260" height="80"/><text x="840" y="545">Gate Controller</text>
<line class="line" x1="300" y1="320" x2="420" y2="320"/>
<line class="line" x1="680" y1="320" x2="820" y2="320"/>
<line class="line" x1="950" y1="360" x2="950" y2="500"/>

</svg>